[project]
name = "browser-agent"
version = "0.1.0"
description = "A browser agent harness with context and memory, evaluated on WebArena Verified."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "browser-harness==0.1.13",
    "webarena-verified==1.2.3",
    "openai>=3.51,<4",
    "anthropic>=2.8,<3",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.0",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-q"]
# A dependency of the evaluator ships a string with an invalid escape.
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ANN", "PT", "RET"]
ignore = [
    "ANN401", # Any is the honest type for JSON payloads from CDP and the model
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["browser_agent"]
known-local-folder = ["fakes"]
