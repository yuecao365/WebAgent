<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 612" width="1030" height="612" role="img" aria-label="Architecture. Run path: a task goes to the agent loop, which builds a cache-first prompt and acts through tools on a browser over CDP, reading the accessibility tree; the official evaluator scores the result. A run_skill call goes through a precondition gate: when it passes, verified skill code runs on the browser; when it fails, or a step's check fails, the model follows the skill's steps itself. Learn path: successful learn runs are turned into a SKILL.md with code by a model call, verified by replay with the evaluator and a verifier, and stored in a versioned skill library that feeds the run path.">
  <style>
    .bg { fill: #ffffff; }
    .frame { fill: #f6f8fa; stroke: #e4e8ec; }
    .card { fill: #ffffff; stroke: #d8dee4; }
    .route { fill: #ffffff; stroke: #c9d7ee; }
    .agent { fill: #f6f3ff; stroke: #b9a8f7; }
    .pill { fill: #ffffff; stroke: #8c959f; stroke-width: 1.3; }
    .t { fill: #1f2328; font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .s { fill: #656d76; font: 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sec { fill: #8c959f; font: 600 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .1em; }
    .k { font: 700 10px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .1em; }
    .ka { fill: #6e56cf; } .kl { fill: #2f6fd6; } .kc { fill: #6e7781; }
    .dot { fill: #2f6fd6; }
    .flow { fill: none; stroke: #8c959f; stroke-width: 1.6; stroke-linecap: round; }
    .build { fill: none; stroke: #b0b8c1; stroke-width: 1.4; stroke-dasharray: 5 4; stroke-linecap: round; }
    .head { fill: #8c959f; }
    .headb { fill: #b0b8c1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .frame { fill: #11161d; stroke: #262c36; }
      .card, .route { fill: #161b22; stroke: #30363d; }
      .agent { fill: #1d1838; stroke: #5d4bb5; }
      .pill { fill: #161b22; stroke: #6e7681; }
      .t { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .sec { fill: #6e7681; }
      .ka { fill: #b4a2ff; } .kl { fill: #79a8f2; } .kc { fill: #9198a1; }
      .dot { fill: #79a8f2; }
      .flow { stroke: #6e7681; } .head { fill: #6e7681; }
      .build { stroke: #484f58; } .headb { fill: #484f58; }
    }
  </style>
  <defs>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="head" d="M0 0.5L10 5L0 9.5z"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="headb" d="M0 0.5L10 5L0 9.5z"/>
    </marker>
  </defs>

  <rect class="bg" width="1030" height="612" rx="14"/>

  <!-- run path -->
  <rect class="frame" x="134" y="30" width="872" height="386" rx="14"/>
  <text class="sec" x="154" y="56">RUN PATH</text>

  <rect class="pill" x="20" y="91" width="90" height="42" rx="21" filter="url(#sh)"/>
  <text class="t" x="65" y="117" text-anchor="middle">Task</text>
  <path class="flow" marker-end="url(#a)" d="M110 112 H150"/>

  <rect class="agent" x="152" y="66" width="186" height="92" rx="12" filter="url(#sh)"/>
  <text class="k ka" x="168" y="87">AGENT</text>
  <text class="t" x="168" y="108">Agent loop</text>
  <text class="s" x="168" y="129">one model call per step,</text>
  <text class="s" x="168" y="146">under budgets</text>

  <path class="flow" marker-end="url(#a)" d="M245 232 V161"/>
  <rect class="card" x="152" y="232" width="186" height="66" rx="10" filter="url(#sh)"/>
  <text class="k kc" x="166" y="252">CODE</text>
  <text class="t" x="166" y="272">Cache-first prompt</text>
  <text class="s" x="166" y="289">stable prefix, page last</text>

  <path class="flow" marker-start="url(#a)" marker-end="url(#a)" d="M342 112 H368"/>
  <rect class="card" x="370" y="79" width="174" height="66" rx="10" filter="url(#sh)"/>
  <text class="k kc" x="384" y="99">CODE</text>
  <text class="t" x="384" y="119">Tools</text>
  <text class="s" x="384" y="136">click, type, goto, read</text>

  <path class="flow" marker-start="url(#a)" marker-end="url(#a)" d="M548 112 H574"/>
  <rect class="route" x="576" y="81" width="180" height="62" rx="10" filter="url(#sh)"/>
  <circle class="dot" cx="594" cy="104" r="4"/>
  <text class="t" x="607" y="109">Browser over CDP</text>
  <text class="s" x="607" y="128">accessibility tree</text>

  <path class="flow" marker-end="url(#a)" d="M756 112 H806"/>
  <rect class="card" x="808" y="79" width="180" height="66" rx="10" filter="url(#sh)"/>
  <text class="k kc" x="822" y="99">CODE</text>
  <text class="t" x="822" y="119">Official evaluator</text>
  <text class="s" x="822" y="136">pass or fail per task</text>

  <!-- run_skill: gate, then code or guided steps -->
  <path class="flow" marker-end="url(#a)" d="M500 145 C500 265 520 265 574 265"/>
  <text class="s" x="511" y="209">run_skill</text>

  <rect class="card" x="576" y="232" width="180" height="66" rx="10" filter="url(#sh)"/>
  <text class="k kc" x="590" y="252">CODE</text>
  <text class="t" x="590" y="272">Precondition gate</text>
  <text class="s" x="590" y="289">does the page match?</text>

  <path class="flow" marker-end="url(#a)" d="M756 265 H806"/>
  <text class="s" x="781" y="258" text-anchor="middle">pass</text>
  <rect class="card" x="808" y="232" width="180" height="66" rx="10" filter="url(#sh)"/>
  <text class="k kc" x="822" y="252">CODE</text>
  <text class="t" x="822" y="272">Skill code</text>
  <text class="s" x="822" y="289">replays verified steps</text>
  <path class="flow" marker-end="url(#a)" d="M842 232 C842 190 790 186 752 146"/>

  <path class="flow" marker-end="url(#a)" d="M666 298 V328"/>
  <text class="s" x="675" y="318">fail</text>
  <rect class="agent" x="576" y="330" width="180" height="66" rx="12" filter="url(#sh)"/>
  <text class="k ka" x="590" y="350">AGENT</text>
  <text class="t" x="590" y="370">Guided steps</text>
  <text class="s" x="590" y="387">model follows SKILL.md</text>
  <path class="flow" marker-end="url(#a)" d="M868 298 C868 363 820 363 758 363"/>
  <text class="s" x="878" y="345">check fails</text>
  <path class="flow" marker-end="url(#a)" d="M576 363 C440 363 420 300 420 148"/>

  <!-- learn path -->
  <rect class="frame" x="134" y="440" width="872" height="126" rx="14"/>
  <text class="sec" x="154" y="466">LEARN PATH</text>

  <rect class="pill" x="152" y="494" width="186" height="42" rx="21" filter="url(#sh)"/>
  <text class="t" x="245" y="520" text-anchor="middle">Successful learn runs</text>
  <path class="build" marker-end="url(#b)" d="M338 515 H368"/>

  <rect class="card" x="370" y="482" width="174" height="66" rx="10" filter="url(#sh)"/>
  <text class="k kl" x="384" y="502">LLM CALL</text>
  <text class="t" x="384" y="522">Induce skill</text>
  <text class="s" x="384" y="539">SKILL.md + code</text>
  <path class="build" marker-end="url(#b)" d="M544 515 H574"/>

  <rect class="card" x="576" y="482" width="180" height="66" rx="10" filter="url(#sh)"/>
  <text class="k" x="590" y="502"><tspan class="kc">CODE + </tspan><tspan class="kl">LLM CALL</tspan></text>
  <text class="t" x="590" y="522">Replay verification</text>
  <text class="s" x="590" y="539">evaluator + verifier</text>
  <path class="build" marker-end="url(#b)" d="M756 515 H806"/>

  <rect class="route" x="808" y="484" width="180" height="62" rx="10" filter="url(#sh)"/>
  <circle class="dot" cx="826" cy="507" r="4"/>
  <text class="t" x="839" y="512">Skill library</text>
  <text class="s" x="839" y="531">versioned, append-only</text>

  <path class="build" marker-end="url(#b)" d="M966 484 V301"/>
  <path class="build" marker-end="url(#b)" d="M830 484 C830 436 720 444 720 399"/>

  <!-- legend -->
  <path class="build" marker-end="url(#b)" d="M610 592 H646"/>
  <text class="s" x="656" y="596">learn path (once)</text>
  <path class="flow" marker-end="url(#a)" d="M800 592 H836"/>
  <text class="s" x="846" y="596">run path (every task)</text>
</svg>
